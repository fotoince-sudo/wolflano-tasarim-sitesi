# main'e her gönderimde: siteyi küçült ve okunması zor hâle getir, tarayıcıda dene,
# hatasızsa "yayin" dalına koy ve TurkHosting'e (Plesk) haber ver.
# TurkHosting'in Git ayarı "yayin" dalını çekecek şekilde ayarlanınca ziyaretçiler yalnız küçültülmüş sürümü görür.
name: Yayın paketi

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Her gece: yönetimden eklenen/değişen ürünlerin arama motoru sayfaları ve site haritası yenilensin
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Araçları kur
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund html-minifier-terser@7 playwright@1.48.2
          npx playwright install chromium
          node -e 'require("playwright").chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exitCode = 1; })' || npx playwright install-deps chromium
      - name: Küçült
        run: node .github/derle.mjs
      - name: Tarayıcıda dene
        run: node .github/dene.mjs
      - name: Arama motoru sayfalarını üret
        run: node .github/onizle.mjs
      - name: Önceki ortak kod dosyalarını koru
        # Önbellekteki eski sayfa birkaç dakika eski kod dosyasını isteyebilir; bir önceki yayının dosyaları da kalsın
        run: |
          git fetch -q --depth 1 origin yayin || exit 0
          for f in $(git show FETCH_HEAD:index.html 2>/dev/null | grep -o 'app-[a-f0-9]*\.\(js\|css\)' | sort -u); do
            [ -f "dist/$f" ] || git show "FETCH_HEAD:$f" > "dist/$f" 2>/dev/null || true
          done
      - name: yayin dalına koy
        run: |
          cd dist
          git init -q -b yayin
          git config user.name "fotoince-sudo"
          git config user.email "fotoince@gmail.com"
          git add -A
          git commit -q -m "Yayın: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" yayin
      - name: Plesk'e haber ver
        run: |
          curl -fsS -X POST --retry 3 --max-time 60 \
            "https://static-159-253-45-63.sunucuhub.com:8443/modules/git/public/web-hook.php?uuid=3b8aaa1b-6ef8-9e45-f026-c2b39e444f9a" \
            -H "Content-Type: application/json" -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/yayin"}' || true
      - name: Arama motorlarına haber ver (IndexNow, Bing ve Yandex)
        run: |
          sleep 90
          node -e 'const u=JSON.parse(require("fs").readFileSync("indexnow-urls.json","utf8"));process.stdout.write(JSON.stringify({host:"wolflano.com.tr",key:"60862039232c2d46f8f91e2dea87bbe1",keyLocation:"https://wolflano.com.tr/60862039232c2d46f8f91e2dea87bbe1.txt",urlList:u.slice(0,10000)}))' > indexnow.json
          curl -sS -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d @indexnow.json -o /dev/null -w "IndexNow %{http_code}\n" || true
