name: Studio fix checks
on:
  pull_request:
    paths:
      - 'studyo.html'
      - 'tests/studio-fix-checks.cjs'
      - '.github/workflows/studio-fix-checks.yml'
  push:
    branches:
      - 'fix/mug-template-delete-product-switch'
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/studio-fix-checks.cjs
