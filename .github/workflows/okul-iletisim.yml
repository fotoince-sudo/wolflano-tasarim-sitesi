# Okul iletişim robotu: okulların kendi sitelerinden yayımlanmış e-posta/telefonu toplar ve yönetim panelindeki Kasa'ya yazar.
# Okul sitelerini Türkiye'deki sunucu (wolflano.com.tr/api/okul-iletisim.php) okur. Yalnız elle çalışır; hiçbir okula ileti göndermez.
name: Okul iletişim
on:
  workflow_dispatch:
    inputs:
      adet:
        description: 'Kaç okul (boş = hepsi)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 okul-robot/topla.py okul-robot/okullar.csv "${{ inputs.adet }}"
