name: gecici-kontrol
on: push
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://wolflano.com.tr/index.html?x=$RANDOM" -o i.html
          echo "::notice::boyut=$(wc -c < i.html) pdel=$(grep -c pdel i.html) wfadm=$(grep -c WF_ADM i.html)"
          echo "::notice::basliklar=$(curl -sI https://wolflano.com.tr/index.html | grep -i 'cache\|last-mod\|expires' | tr -d '\r' | tr '\n' ' ')"
