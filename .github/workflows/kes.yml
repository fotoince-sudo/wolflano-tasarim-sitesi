# Ürün fotoğraflarının zeminini otomatik temizler.
# GitHub'ın zamanlanmış çalıştırmaları saatlerce gecikebildiği için iş sürekli açık bekler:
# her dakika yönetim panelinde yeni yüklenen ürün fotoğrafı var mı bakar; varsa .github/kes.py ile işler,
# sonucu cut/ klasörüne koyar ve siteyi yeniden yayınlatır. Yaklaşık 5,5 saat sonra kendini yeniden başlatır.
# Saatlik zamanlama yalnız yedek: bekleyen iş bir sebeple durursa yeniden açar.
name: Ürün fotoğrafı temizleme

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/kes.py', '.github/yeni.py', '.github/workflows/kes.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: kes
  cancel-in-progress: false

jobs:
  kes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: isnet.onnx
          key: isnet-general-use-v1
      - name: Araçları kur
        run: |
          pip install -q onnxruntime opencv-python-headless pillow numpy
          [ -f isnet.onnx ] || curl -fsSL -o isnet.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
      - name: Bekle ve temizle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fotoince-sudo"
          git config user.email "fotoince@gmail.com"
          son=$((SECONDS + 330*60))
          while [ $SECONDS -lt $son ]; do
            git pull -q --rebase origin main || true
            n=$(python3 .github/yeni.py)
            if [ "$n" != "0" ]; then
              echo "yeni fotoğraf: $n"
              python3 .github/kes.py || echo "temizleme hatası"
              git add cut
              if ! git diff --cached --quiet; then
                git commit -q -m "Ürün fotoğrafları: zemin temizlendi"
                for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
                gh workflow run derle.yml --ref main || true
              fi
            fi
            sleep 60
          done
      - name: Yeniden başlat
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kes.yml --ref main
