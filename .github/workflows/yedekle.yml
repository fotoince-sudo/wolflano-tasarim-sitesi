# Supabase tablolarını JSON olarak indirir; sonuç Actions > çalışma > Artifacts altında "supabase-yedek" olarak çıkar.
# Gerekli secret: SUPABASE_SERVICE_KEY (Supabase > Settings > API > service_role). Yoksa anon anahtar kullanılır (RLS izin verdiği kadar).
name: Supabase yedekle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yedek:
    runs-on: ubuntu-latest
    steps:
      - name: Tabloları çek
        env:
          URL: https://wgovwmeirlzwalelazfj.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            KEY=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/js/supabaseClient.js | grep -o "eyJ[A-Za-z0-9_.-]*" | head -1)
          fi
          mkdir -p yedek
          curl -fsSL "$URL/rest/v1/" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o yedek/_sema.json
          for t in $(jq -r '.paths | keys[] | select(. != "/" and (startswith("/rpc/") | not)) | ltrimstr("/")' yedek/_sema.json); do
            offset=0
            pages=()
            while :; do
              page="yedek/.$t-$offset.json"
              end=$((offset + 999))
              curl -fsSL "$URL/rest/v1/$t?select=*" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Range-Unit: items" -H "Range: $offset-$end" -o "$page"
              count=$(jq -er 'if type == "array" then length else error("Beklenen yanıt bir JSON dizisi değil") end' "$page")
              pages+=("$page")
              [ "$count" -eq 0 ] && break
              offset=$((offset + count))
            done
            jq -s 'add' "${pages[@]}" > "yedek/$t.json"
            rm -- "${pages[@]}"
            echo "$t: $offset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-yedek
          path: yedek
          retention-days: 7
