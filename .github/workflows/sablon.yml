# Canva şablon görsellerini A3 300 dpi baskı dosyasına çevirir (sablon/is.json değişince).
# Tam boy dosyalar "baski" dalına, stüdyo önizlemeleri main'deki sablon/web/ klasörüne yazılır.
name: Şablon baskı hazırlama

on:
  push:
    branches: [main]
    paths: ['sablon/is.json', '.github/sablon.py', '.github/workflows/sablon.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sablon
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: realesr-general-x4v3.pth
          key: realesr-general-x4v3-v1
      - name: Araçları kur
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel pillow numpy scipy
          python3 -c "import torch, torchvision, spandrel; print('torch', torch.__version__, 'spandrel ok')"
          [ -f realesr-general-x4v3.pth ] || curl -fsSL -o realesr-general-x4v3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
      - name: Hazırla
        run: python3 .github/sablon.py 2>&1 | tee sablon/son-calisma.txt
      - name: Kaydet
        if: always()
        run: |
          git config user.name "fotoince-sudo"
          git config user.email "fotoince@gmail.com"
          mkdir -p /tmp/out/web /tmp/baski
          cp sablon/web/*.webp /tmp/out/web/ 2>/dev/null || true
          cp sablon/rapor.json sablon/son-calisma.txt /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/kaynak && cp sablon/kaynak/*.png /tmp/out/kaynak/ 2>/dev/null || true
          cp baski/*.png /tmp/baski/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p sablon/web && cp /tmp/out/web/*.webp sablon/web/ 2>/dev/null || true
            cp /tmp/out/rapor.json /tmp/out/son-calisma.txt sablon/ 2>/dev/null || true
            mkdir -p sablon/kaynak && cp /tmp/out/kaynak/*.png sablon/kaynak/ 2>/dev/null || true
            git add sablon
            git commit -q -m "Şablonlar: baskı dosyaları hazırlandı" || break
            git push -q origin HEAD:main && break
            sleep 5
          done
          # tam boy dosyalar ayrı dala (siteye yüklenmez)
          if ls /tmp/baski/*.png >/dev/null 2>&1; then
            git fetch -q origin baski || true
            if git rev-parse -q --verify origin/baski >/dev/null; then git checkout -q -f -B baski origin/baski; else git checkout -q -f --orphan baski; git rm -rqf --cached . >/dev/null || true; fi
            mkdir -p baski && cp /tmp/baski/*.png baski/
            git add baski/*.png && git commit -q -m "Baskı dosyaları (A3 300 dpi)" && git push -q origin baski
          fi
