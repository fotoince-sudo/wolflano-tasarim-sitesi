# Sunucu fonksiyonlarını (Supabase Edge Functions) otomatik yükler.
# main'e gönderilen bir değişiklik supabase/functions altındaki bir fonksiyonu değiştirdiyse yalnız o fonksiyon yüklenir
# (_shared değiştiyse hepsi). Elle çalıştırınca ("Run workflow") istenen fonksiyon ya da hepsi yüklenir.
# Gerekli: GitHub → Settings → Secrets and variables → Actions → SUPABASE_ACCESS_TOKEN
name: Sunucu fonksiyonları

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      fonksiyon:
        description: 'Yüklenecek fonksiyon adı (boş = hepsi)'
        required: false
        default: ''

concurrency:
  group: fonksiyon
  cancel-in-progress: false

jobs:
  yukle:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJE: wgovwmeirlzwalelazfj
      # Giriş kontrolünü kendisi yapan (ya da herkese açık) fonksiyonlar: canlıdaki ayarla aynı kalmalı
      ACIK: 'order-create stok-haber dogum-gunu'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anahtar var mı
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN tanımlı değil. GitHub → Settings → Secrets and variables → Actions bölümüne ekleyin."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Hangi fonksiyonlar
        id: sec
        run: |
          hepsi=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.fonksiyon }}" ]; then liste="${{ inputs.fonksiyon }}"; else liste="$hepsi"; fi
          else
            once="${{ github.event.before }}"
            if [ -z "$once" ] || ! git cat-file -e "$once" 2>/dev/null; then once="HEAD~1"; fi
            degisen=$(git diff --name-only "$once" "${{ github.sha }}" -- supabase/functions | cut -d/ -f3 | sort -u)
            if echo "$degisen" | grep -qx '_shared'; then liste="$hepsi"; else liste=$(echo "$degisen" | grep -v '^_' || true); fi
          fi
          echo "liste=$(echo $liste)" >> "$GITHUB_OUTPUT"
          echo "Yüklenecek: $liste"
      - name: Yükle
        if: steps.sec.outputs.liste != ''
        run: |
          for f in ${{ steps.sec.outputs.liste }}; do
            [ -d "supabase/functions/$f" ] || { echo "$f klasörü yok, atlandı"; continue; }
            ek=""; case " $ACIK " in *" $f "*) ek="--no-verify-jwt";; esac
            echo "→ $f $ek"
            supabase functions deploy "$f" --project-ref "$PROJE" --use-api $ek
          done
