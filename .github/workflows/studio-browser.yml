name: Studio browser regression
on:
  push:
    branches: ['fix/mug-template-delete-product-switch']
  pull_request:
    paths: ['studyo.html', 'tests/studio-browser.cjs', '.github/workflows/studio-browser.yml']
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/studio-browser.cjs
