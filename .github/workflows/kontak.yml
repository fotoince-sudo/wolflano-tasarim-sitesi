# Tek seferlik: ürün tasarımlarının küçük resimlerini numaralı kontak tablolarına dizer (getir/kontak-N.jpg).
name: Kontak tablosu
on:
  push:
    branches: [main]
    paths: ['getir/kontak.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kontak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tabloları yap
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import json, urllib.request, io
          from PIL import Image, ImageDraw, ImageFont
          L = json.load(open('getir/kontak.json'))
          base = 'https://wgovwmeirlzwalelazfj.supabase.co/storage/v1/object/public/site/'
          C, R, W = 4, 4, 400
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 34)
          for s in range(0, len(L), C * R):
              sheet = Image.new('RGB', (C * W, R * W), 'white'); d = ImageDraw.Draw(sheet)
              for j, (i, img) in enumerate(L[s:s + C * R]):
                  x, y = (j % C) * W, (j // C) * W
                  try:
                      u = img if img.startswith('http') else base + img
                      im = Image.open(io.BytesIO(urllib.request.urlopen(u, timeout=30).read())).convert('RGB')
                      w0, h0 = im.size
                      if 'ortam-canvas' in img: box = (0.30, 0.10, 0.70, 0.42)
                      elif 'tas-hq' in img: box = (0.40, 0.35, 0.98, 0.85)
                      else: box = (0.28, 0.18, 0.72, 0.62)
                      im = im.crop((int(box[0]*w0), int(box[1]*h0), int(box[2]*w0), int(box[3]*h0)))
                      im.thumbnail((W - 6, W - 6)); sheet.paste(im, (x + (W - im.width) // 2, y + (W - im.height) // 2))
                  except Exception as e:
                      d.text((x + 10, y + 120), 'yok', fill='red', font=font)
                  d.rectangle([x, y, x + 62, y + 42], fill='yellow'); d.text((x + 4, y + 2), str(i), fill='black', font=font)
              sheet.save('getir/kontak-%d.jpg' % (s // (C * R) + 1), quality=80)
          PY
          git config user.name "fotoince-sudo"; git config user.email "fotoince@gmail.com"
          git add getir/kontak-*.jpg; git commit -q -m "Kontak tabloları" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
