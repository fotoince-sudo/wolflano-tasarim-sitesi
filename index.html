<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fbf9">
<title>Wolflano</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400&display=swap">
<style>
/* Düzen: tek sütun mobil akış, sabit üst çubuk, hash ile sayfa geçişi. Beyaz-yeşil mağaza dili, serif başlıklar. */
:root{
  --bg:#f8fbf9;--mint:#ebf6f0;--green:#30703f;--green2:#00723b;--ink:#101a14;--muted:#596760;--line:#dde7e1;
  --blue:#dbeefd;--navy:#0f2f66;--card:#ffffff;--onGreen:#ffffff;--btn2:#e6f2ea;--red:#e5393a;--bar:#000;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1511;--mint:#142019;--green:#3f8f55;--green2:#4fbf7a;--ink:#eef5f0;--muted:#9bb0a3;--line:#243229;
  --blue:#13273f;--navy:#a9cdf5;--card:#16211b;--onGreen:#ffffff;--btn2:#1d2d24;--red:#ff6b6b;--bar:#000;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511;--mint:#142019;--green:#3f8f55;--green2:#4fbf7a;--ink:#eef5f0;--muted:#9bb0a3;--line:#243229;
  --blue:#13273f;--navy:#a9cdf5;--card:#16211b;--onGreen:#ffffff;--btn2:#1d2d24;--red:#ff6b6b;--bar:#000;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--ui);margin:0;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.025em;margin:0;text-wrap:balance;line-height:1.12}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green2);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:4px;height:72px}
@media (max-width:440px){.word{font-size:16px!important}.brand{gap:8px!important}.brand img{width:38px!important}.ib{width:40px!important}.top .wrap{padding-inline:12px}}
@media (max-width:400px){.top .wrap{gap:0;padding-inline:8px}.brand{gap:6px!important;flex:0 1 auto;min-width:0}.brand img{width:32px!important;height:30px}.word{font-size:14px!important;letter-spacing:.05em}.ib{width:38px!important;flex:none}.lang{margin-right:0;padding:0 2px}}
@media (max-width:350px){.word{font-size:13px!important;letter-spacing:.03em}.ib{width:34px!important}}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto;border:0;background:none;padding:0}
.brand img{width:44px;height:36px;object-fit:cover;object-position:left center;border-radius:8px;mix-blend-mode:multiply}
:root[data-theme="dark"] .brand img{mix-blend-mode:normal}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img{mix-blend-mode:normal}}
.word{font:700 20px/1 var(--ui);letter-spacing:.09em}.word b{color:var(--green)}
.nav{display:none;gap:4px}
.nav a{padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted)}
.nav a:hover,.nav a.on{color:var(--green);background:var(--btn2)}
.ib{position:relative;width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center}
.ib:hover{background:var(--btn2)}
.badge{position:absolute;top:2px;right:0;min-width:20px;height:20px;border-radius:10px;background:var(--green);color:#fff;font:700 12px/20px var(--ui);text-align:center;padding:0 5px}
.menu-btn{display:grid}
@media (min-width:900px){.nav{display:flex}.menu-btn{display:none}}

/* çekmece menü */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--bg);z-index:41;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drawer a{padding:14px 12px;border-radius:12px;text-decoration:none;font:600 16px var(--ui)}
.drawer a.on{background:var(--btn2);color:var(--green)}

/* ortak */
main{min-height:60vh}
.page{padding-block:32px 56px}
.eyebrow{font:700 14px var(--ui);letter-spacing:.1em;color:var(--green);text-transform:uppercase;margin:0 0 6px}
.h2{font-size:clamp(29px,6vw,40px)}
.lead{color:var(--muted);font-size:16px;max-width:60ch;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:8px;padding:16px 20px;font:600 15px var(--ui);text-decoration:none;background:var(--green);color:var(--onGreen)}
.btn.soft{background:var(--btn2);color:var(--ink)}
.btn.onG{background:var(--btn2);color:#12301a}
.btn.sm{padding:10px 14px;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:28px}
.link{display:inline-flex;gap:8px;align-items:center;color:var(--green);font:600 16px var(--ui);text-decoration:none;white-space:nowrap}

/* ana sayfa */
.hero img{display:block;width:100%;height:auto;max-height:480px;object-fit:cover;object-position:center 40%}
.strip{background:var(--bar);color:#fff;text-align:center;font:600 14px/1.35 var(--ui);letter-spacing:.14em;padding:20px 16px;text-transform:uppercase}
.strip em{font-style:normal;color:var(--red)}
.intro{text-align:center;padding-block:48px 8px}
.pill{display:inline-block;background:var(--green);color:#fff;font:600 15px var(--ui);letter-spacing:.06em;padding:12px 22px;border-radius:6px;text-transform:uppercase}
.intro h1{font-size:clamp(41px,9vw,68px);margin:36px 0 22px}
.intro h1 i{color:var(--green);font-style:normal}
.intro p{color:var(--muted);font-size:18px;line-height:1.65;margin:0 auto;max-width:34ch}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.pair{display:grid;gap:16px;margin-top:48px}
@media (min-width:760px){.pair{grid-template-columns:1fr 1fr}}
.big{border-radius:24px;padding:32px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.big .i{width:44px;height:44px;stroke-width:1.5;margin-bottom:22px}
.big h2{font-size:clamp(31px,6vw,38px);margin-bottom:14px}
.big p{font-size:17px;line-height:1.55;margin:0 0 32px;max-width:30ch}
.big.g{background:var(--green);color:#fff}.big.g p{color:rgba(255,255,255,.88)}
.big.b{background:var(--blue);color:var(--navy)}.big.b p{color:color-mix(in srgb,var(--navy) 85%,transparent)}
.big.b .btn{background:var(--green);color:#fff}
.how{background:var(--mint);border-block:1px solid var(--line);margin-top:56px;padding-block:56px}
.how h2{text-align:center;font-size:clamp(31px,6vw,40px);margin-bottom:36px}
.steps{display:grid;gap:28px;max-width:900px;margin:0 auto}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{display:flex;gap:18px;align-items:flex-start}
.step .dot{width:60px;height:60px;border-radius:50%;background:var(--green2);display:grid;place-items:center;color:#fff;flex:none}
.step .dot .i{width:28px;height:28px}
.step h3{font-size:22px;margin:2px 0 6px;font-weight:600}
.step p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.feat{padding-block:64px 24px}

/* ürün ızgarası */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:40px 20px}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
.feat.feat-first{padding-top:36px}
.card{min-width:0;display:flex;flex-direction:column}
.sumr[hidden]{display:none!important}
.sumr>span:last-child{white-space:nowrap}
.kur{margin-top:56px}
.kur .kgrid{display:grid;gap:12px;margin-top:24px}
@media (min-width:700px){.kur .kgrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.kur .kgrid{grid-template-columns:repeat(3,1fr)}}
.kcard{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px;display:flex;gap:14px;align-items:flex-start}
.kcard .ki{flex:none;width:46px;height:46px;border-radius:12px;background:var(--mint);color:var(--green);display:grid;place-items:center}
.kcard .ki svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kcard h3{font:700 16px/1.25 var(--ui);margin:2px 0 6px}
.kcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.kq{margin-top:16px;border-radius:18px;background:#101a14;color:#fff;padding:20px;display:flex;gap:14px;align-items:center}
.kq b{display:block;font:700 clamp(13px,3.9vw,17px) var(--ui);white-space:nowrap;letter-spacing:-.01em}
.kq>div{min-width:0}
.gal img[src*="renk/"]{object-fit:contain!important;background:linear-gradient(160deg,#d6dad8,#c3c8c5)}
.mainv img[src*="renk/"]{padding:5%}
.ph img.bcimg{object-fit:contain!important;padding:8%;background:linear-gradient(160deg,#d6dad8,#c3c8c5)}
.sci img{background:#e9eeeb;object-fit:contain!important}
.sci .qty{gap:14px!important}
.scg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.scs{display:grid;justify-items:center;gap:4px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.scs.on{border-color:var(--green)}
.scs b{font:600 12px var(--ui)}
.scs span{display:flex;align-items:center;gap:6px}
.scs button{width:24px!important;height:24px!important;min-width:0!important;min-height:0!important;flex:none;border-radius:999px!important;border:1px solid var(--green)!important;background:none!important;font:700 14px/1 var(--ui)!important;color:var(--ink)!important;padding:0!important;display:grid;place-items:center}
.scs span{gap:4px!important}
.scs output{min-width:14px!important}
.scs output{min-width:18px;text-align:center;font:600 13px var(--ui)}
.scg.need{animation:scNeed .9s ease 2}
@keyframes scNeed{50%{box-shadow:0 0 0 3px rgba(220,60,40,.35);border-radius:10px}}
.sci .qty a.rm{color:var(--green);text-decoration:underline;font:500 12px var(--ui)}
.bcs{width:100%;display:grid;gap:8px}
.bcs p{margin:0;text-align:center;font:500 13px var(--ui);color:var(--muted)}
.bcs p b{color:var(--ink)}
.bcs>div{display:flex;justify-content:flex-start;flex-wrap:nowrap;gap:clamp(5px,1.8vw,10px);overflow-x:auto;scrollbar-width:none;padding:4px 2px}.bcs>div::-webkit-scrollbar{display:none}.bcs>div>:first-child{margin-left:auto}.bcs>div>:last-child{margin-right:auto}.bcs .bc{flex:none;width:clamp(28px,8.2vw,34px);height:clamp(28px,8.2vw,34px)}
.bc{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;box-shadow:inset 0 0 0 3px var(--bg)}
.bc.on{outline:2px solid var(--green);outline-offset:2px}
.ced{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ced .crow{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px}
.ced input[type=color]{width:100%;height:42px;padding:2px;border-radius:10px}
.ced .cph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ced .cslot{display:grid;gap:6px;justify-items:center;border:1px dashed var(--line);border-radius:10px;padding:8px;font:600 12px var(--ui)}
.ced .rgrid{display:grid;gap:8px}.rrow .btn{grid-column:1/-1;justify-self:end}.rrow{display:grid;grid-template-columns:86px 1fr 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}.rrow .rn{display:flex;gap:6px;align-items:center;font:600 13px var(--ui)}.rrow .rn i{width:16px;height:16px;border-radius:50%;border:1px solid #0003;flex:none}.rsl{display:grid;gap:2px;justify-items:center;font:600 11px var(--ui);color:var(--mute)}.rsl img,.rsl b{width:100%;height:96px;object-fit:contain;border-radius:8px;background:#e9ecea}.rsl b{display:grid;place-items:center;font-weight:500;border:1px dashed var(--line);background:none}.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.ritem{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px;font:12px var(--ui)}.ritem img{width:100%;height:120px;object-fit:contain;border-radius:8px;background:#e9ecea}.ritem select{font:12px var(--ui);padding:4px;border-radius:8px}.ritem .st{font-weight:600}.ritem .st.w{color:#b26b00}.thumb .bkl{position:absolute;left:4px;bottom:4px;background:#000b;color:#fff;font:600 10px var(--ui);padding:1px 5px;border-radius:6px}.thumb{position:relative}
.cslot img{width:100%;height:110px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px;border-radius:8px}
.ced .cslot i{font-style:normal;color:var(--muted);height:110px;display:grid;place-items:center}
/* Kurumsal kartlar: görsel çizimler */
.kcard{align-items:center!important;padding:14px!important;gap:14px!important}
.kcard .ki{width:84px!important;height:84px!important;border-radius:16px!important;background:linear-gradient(160deg,#f3f8f5,#e4efe8)!important;padding:6px;flex:none}
.kcard .ki svg{width:100%!important;height:100%!important;fill:initial!important;stroke:none!important}
.kcard h3{margin:0 0 4px!important}
/* Kurumsal düğmeler: kibar, orantılı, aynı yeşil */
.kcta{display:grid!important;grid-template-columns:1fr;gap:10px;margin-top:14px!important}
.kur .kgift{margin-top:10px}
.ksteps{gap:8px!important;margin-top:12px!important}
.ksteps div{display:grid!important;grid-template-columns:30px 1fr;column-gap:12px;align-items:start;padding:12px 14px!important}
.ksteps div:before{margin:0!important;grid-row:span 2;width:28px!important;height:28px!important;font-size:13px}
.ksteps b{margin:2px 0 2px!important}
.ksteps span{font-size:13.5px!important}
.kcta .btn{width:100%;justify-content:center;gap:8px;padding:11px 14px;border-radius:999px;font:600 14px var(--ui);margin:0}
.kcta .btn .i,.kcta .btn svg{width:17px;height:17px}
.kcta .btn.soft{background:transparent;border:1px solid var(--green);color:var(--green)}
.page:has(> .kur:last-child){padding-bottom:0!important}
.how{margin-top:28px!important;padding-block:30px!important}
.how h2{margin-bottom:20px!important;font-size:clamp(26px,6vw,36px)!important}
.steps{gap:18px!important}
.step{gap:14px!important}
.step .dot{width:48px!important;height:48px!important;background:var(--green)!important}
.step .dot .i{width:22px!important;height:22px!important}
.step h3{font-size:18px!important;margin:0 0 4px!important}
.step p{font-size:15px!important}
@media (max-width:350px){.kq{padding:16px 14px;gap:10px}.kq .ki{width:38px;height:38px}}.kq small{display:block;color:rgba(255,255,255,.78);font-size:14px;line-height:1.45;margin-top:4px}
.kq .ki{flex:none;width:46px;height:46px;border-radius:50%;background:#30703f;display:grid;place-items:center}
.kq .ki svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kcta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.kgift{margin-top:12px;color:var(--green);font-weight:600}
.ksteps{display:grid;gap:12px;margin-top:20px;counter-reset:ks}
@media (min-width:760px){.ksteps{grid-template-columns:repeat(4,1fr)}}
.ksteps div{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.ksteps div:before{counter-increment:ks;content:counter(ks);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;margin-bottom:10px}
.ksteps b{display:block;font-size:14px;margin-bottom:4px}.ksteps span{color:var(--muted);font-size:14px;line-height:1.45}
.wolfban{display:flex;align-items:center;gap:16px;margin-top:24px;padding:18px;border-radius:16px;background:#101a14;color:#fff;text-decoration:none;box-shadow:0 10px 30px rgba(16,26,20,.18)}
.wolfban .wic{flex:none;width:64px;height:64px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}
.wolfban .wic img{width:56px;height:56px;object-fit:contain}
.wolfban .wtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.wolfban b{font:700 18px var(--ui);letter-spacing:.02em}
.wolfban small{font:500 14px/1.4 var(--ui);color:rgba(255,255,255,.75)}
.wolfban .wgo{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12)}
.wolfban .wgo svg{width:20px;height:20px}
.ph{display:block;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--mint)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:12px;left:12px;background:var(--blue);color:var(--navy);font:600 14px var(--ui);padding:5px 14px;border-radius:999px}
.meta{padding-top:14px;display:flex;flex-direction:column;gap:2px}
.meta small{font:500 14px var(--ui);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row h3{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.price{font:500 22px var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}.meta .price{font:500 15px var(--ui);color:var(--ink);letter-spacing:.01em}.meta small{font-size:13px}
.add{margin-top:12px;align-self:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}
.chips button{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:999px;font:600 14px var(--ui)}
.chips button.on{background:var(--green);border-color:var(--green);color:#fff}
/* Kategori içi açılır menü: ürün kategorileri sayfada açıkta durmaz, Kadın/Erkek/Çocuk'un içinde açılır */
.chips button .cv{display:inline-block;margin-left:6px;font-size:11px;transition:transform .15s}
.chips button.open .cv{transform:rotate(180deg)}
.catmenu{margin:-16px 0 24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(16,26,20,.08)}
.catmenu .grp{padding:10px 12px 4px;font:700 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.catmenu .its{display:grid;grid-template-columns:1fr 1fr;gap:2px}

.catmenu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font:500 14px var(--ui);color:var(--ink)}
.catmenu button:hover{background:var(--btn2)}
.catmenu button.on{background:var(--btn2);color:var(--green);font-weight:700}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-12px 0 20px;font:500 14px var(--ui);color:var(--muted)}
.crumb b{color:var(--ink);font-weight:700}
.crumb button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font:500 13px var(--ui)}
.blank{position:relative;border:0;width:100%;cursor:pointer;aspect-ratio:4/5;border-radius:16px;background:var(--mint);display:grid;place-items:center;padding:14%}
.blank svg{width:100%;height:100%}
.bgal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -2px 12px;padding:2px}.bgal img{flex:0 0 72%;max-width:260px;aspect-ratio:4/5;object-fit:cover;border-radius:14px;scroll-snap-align:start;background:var(--mint)}

      img.onerror=function(){bzMsg('Önizleme kaydedilemedi.');};img.src=u;}catch(_){bzMsg('Önizleme kaydedilemedi.');}

async function crmLoad(){
  if(C.busy)return;C.busy=true;C.err='';

   else{var rs=await Promise.all([sbReq('/rest/v1/orders?select=*&order=created_at.desc&limit=200',{token:tk}),sbReq('/rest/v1/crm_customers?select=*&order=last_order_at.desc.nullslast&limit=500',{token:tk}),sbReq('/rest/v1/crm_notes?select=*&order=created_at.desc&limit=500',{token:tk})]);
     if(!rs[0].ok||!rs[1].ok||!rs[2].ok){C.err='Veriler okunamadı.';}

/* Fotoğraf küçültülür (en çok 1800 px); şeffaf PNG/WebP şeffaf kalır, diğerleri JPEG olur */
function udShrink(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){try{
  var k=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight)),W=Math.round(im.naturalWidth*k),H=Math.round(im.naturalHeight*k),c=document.createElement('canvas');c.width=W;c.height=H;
  var x=c.getContext('2d'),alpha=/png|webp/i.test(file.type);if(!alpha){x.fillStyle='#fff';x.fillRect(0,0,W,H);}x.drawImage(im,0,0,W,H);URL.revokeObjectURL(u);
  c.toBlob(function(b){b?res({blob:b,ext:alpha?'png':'jpg'}):rej(new Error('blob'));},alpha?'image/png':'image/jpeg',.9);}catch(e){rej(e);}};
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;});}
async function udUpload(file){var tk=await sbToken();if(!tk)throw new Error('auth');var o=await udShrink(file),key='img/depo-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+o.ext;
  var fd=new FormData();fd.append('cacheControl','31536000');fd.append('',o.blob,key.split('/').pop());
  var r=await fetch(SB.url+'/storage/v1/object/site/'+key,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+tk,'x-upsert':'true'},body:fd});
  if(!r.ok)throw new Error('upload '+r.status);return SB.url+'/storage/v1/object/public/site/'+key;}

function bzInfer(t){
  t=' '+String(t||'').toLocaleLowerCase('tr-TR')+' ';
  if(/şapka|kep\b|cap\b/.test(t)){BZ.prod='hat';}else if(/polo/.test(t))BZ.prod='polo';else if(/sweat|kapüşon|hoodie/.test(t))BZ.prod='sweat';else if(/tişört|tisort|t-shirt|tshirt/.test(t))BZ.prod='tee';
  BZ.face=BZP[BZ.prod].faces[0];
  var cm={beyaz:/beyaz/,siyah:/siyah/,gri:/\bgri/,yesil:/yeşil|yesil/,mavi:/\bmavi/,lacivert:/lacivert/,kahve:/kahve/,kiremit:/kiremit/};
  Object.keys(cm).forEach(function(k){if(cm[k].test(t))BZ.color=k;});
  BZ.style=/karikat/.test(t)?'cartoon':(/kalem|karakalem|çizim/.test(t)?'pencil':(/illüstr|illustr|vektör/.test(t)?'illus':(/kanvas|yağlı|tablo/.test(t)?'canvas':'real')));
  BZ.orient=null;BZ.size=null;
}
document.addEventListener('input',function(e){if(e.target&&e.target.id==='azT')BZ.idea=e.target.value;});
document.addEventListener('change',function(e){var t=e.target;if(t&&t.matches&&t.matches('[data-azfile]')&&t.files&&t.files[0]){var f=t.files[0];t.value='';bzRead(f).then(function(d){BZ.img=d;BZ.res=[null,null];bzReload();}).catch(function(){bzMsg('Fotoğraf okunamadı');});}});
async function bzGen(i){
  var c=bzCur(i),tk=await sbToken();if(!tk)throw {message:'Önce üye girişi yapmalısın.'};
  var ac=new AbortController(),to=setTimeout(function(){ac.abort();},150000),r,j;
  try{r=await fetch(SB.url+'/functions/v1/bz-image',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',apikey:SB.key,Authorization:'Bearer '+tk},body:JSON.stringify({prompt:BZ.idea,style:BZ.style,orient:c.or,image:BZ.img||''})});j=await r.json().catch(function(){return {};});}
  catch(_){throw {message:'Bağlantı kurulamadı. Tekrar dene.'};}finally{clearTimeout(to);}
  if(j.error==='not_configured'&&(EDIT||admOk()))return {img:src(c.or==='portrait'?'builtin:p1':'builtin:hero'),or:c.or,demo:true};
  if(!r.ok||!j.image)throw {message:j.message||'Tasarım şu an hazırlanamadı.'};
  return {img:j.image,or:c.or};
}
async function bzGo(){
  if(BZ.busy)return;var ta=document.getElementById('azT');if(ta)BZ.idea=ta.value;
  if(!BZ.idea.trim()&&!BZ.img){bzMsg('Ne tasarlayalım? Bir cümle yaz, söyle ya da fotoğraf ekle.');return;}
  bzInfer(BZ.idea);bzMsg('');BZ.busy=true;bzPaint();
  var res=await Promise.all([0,1].map(function(i){return bzGen(i).then(function(r){return {r:r};},function(e){return {e:e};});}));
  BZ.busy=false;var err='';
  res.forEach(function(x,i){if(x.r)BZ.res[i]=x.r;else err=err||(x.e&&x.e.message)||'';});
  if(res[0].e&&res[1].e){BZ.res=[null,null];}
  bzPaint();bzMsg(err||((BZ.res[0]&&BZ.res[0].demo)?'Örnek önizleme: yapay zekâ anahtarı bağlanınca burada gerçek tasarımın görünecek. (Bu mesajı sadece sen görüyorsun.)':''));
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-az]');if(!b)return;var a=b.dataset.az,v=b.dataset.v;
  if(a==='rmimg'){BZ.img=null;BZ.res=[null,null];bzReload();}
  else if(a==='go'){bzGo();}
  else if(a==='cart'){bzAddCart();}

    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
    try{if(BZ.rec){BZ.rec.stop();BZ.rec=null;b.classList.remove('rec');return;}var r=new SR();r.lang=(typeof LANG!=='undefined'&&LANG==='en')?'en-US':'tr-TR';r.interimResults=false;b.classList.add('rec');
      r.onresult=function(ev){var s=ev.results[0][0].transcript;BZ.idea=(BZ.idea?BZ.idea+' ':'')+s;var ta=document.getElementById('azT');if(ta)ta.value=BZ.idea;};
      r.onerror=function(){bzMsg('Mikrofon kullanılamadı. Yazarak devam edebilirsin.');b.classList.remove('rec');BZ.rec=null;};r.onend=function(){b.classList.remove('rec');BZ.rec=null;};BZ.rec=r;r.start();}catch(_){bzMsg('Mikrofon kullanılamadı.');}
  }
});

function botPrompt(){
  var cat=BLANKS.map(function(b){return b.name+' '+tl(b.price)+(b.a4?' (A4 baskı +'+tl(b.a4)+', A3 +'+tl(b.a4*A3_KAT)+', logo +'+tl(b.logo)+')':' (ön baskı +'+tl(b.hat)+')');}).join('; ');
  var h=BOT.msgs.map(function(m){return (m.r==='u'?'Müşteri: ':'Asistan: ')+m.t;}).join('\n');
  return 'Sen Wolflano adlı erkek giyim markasının kişiye özel baskı tasarım asistanısın. Amaç: müşterinin fikrini netleştirip uygulanabilir tasarım önerileri sunmak.\n'+
  'Kurallar: Müşterinin yazdığı dilde yanıt ver (Türkçe veya İngilizce). Kısa ol (en fazla 6 cümle). Bir seferde en fazla iki soru sor. Bilgi eksikse sor: ürün (tişört, sweatshirt, polo, şapka, kupa), kesim (erkek, kadın, çocuk), renk (beyaz, siyah, gri, yeşil, mavi, lacivert, kahve, kiremit), yazı/görsel fikri, adet. Yeterli bilgi varsa 2-3 somut tasarım önerisi ver (yazı, yazı stili, yerleşim, renk uyumu).\n'+
  'Sabit kurallar: Baskı alanları boğazdan (arkada enseden) 8 cm, çocuk bedenlerinde 6 cm aşağıda başlar. Tişört ve sweatshirt ön ve arka A4 (dikey veya yatay) veya A3 (yalnız dikey) olabilir, sol göğüste 8x8 cm logo bulunur. Polo ön yüzde yalnız logo, arkada A4 yatay veya A3 dikey. Şapkada yalnız ön, 12x8 cm sabit alan. Fiyatlar KDV dahildir: '+cat+'. Kargo, teslim süresi ve stok hakkında söz verme; bunlar için müşteriyi iletişim bölümüne yönlendir. Başka konulara girme.\n\n'+

function botPaint(){var l=document.getElementById('botL');if(!l)return;l.innerHTML=botMsgHTML({r:'a',t:botIntro()})+BOT.msgs.map(botMsgHTML).join('');l.scrollTop=l.scrollHeight;}
function botErr(t){var m=document.getElementById('botMsg');if(m){m.textContent=t;m.hidden=!t;}}
function botSay(t){try{if(BOT.speak&&window.speechSynthesis){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=LANG==='en'?'en-US':'tr-TR';speechSynthesis.speak(u);}}catch(_){}}
async function botSend(text){
  text=(text||'').trim();if(!text||BOT.busy)return;botErr('');
  if(BOT.sm===undefined){try{BOT.sm=window.claude&&window.claude.use?await window.claude.use('sample'):null;}catch(_){BOT.sm=null;}}
  if(!BOT.sm){botErr(LANG==='en'?'The assistant is not available in this view.':'Asistan bu görünümde kullanılamıyor. Talebini aşağıdaki formla bırakabilirsin.');return;}
  BOT.msgs.push({r:'u',t:text});BOT.msgs.push({r:'a',t:'…'});BOT.busy=true;botPaint();
  var idx=BOT.msgs.length-1;
  try{
    var res=await BOT.sm(botPrompt().replace(/\nAsistan: …\nAsistan:$/,'\nAsistan:'),{cache:false,modelTier:'quick',onText:function(o){BOT.msgs[idx].t=o.text;botPaint();}});
    BOT.msgs[idx].t=(res&&res.text)||'…';botPaint();botSay(BOT.msgs[idx].t);
  }catch(e){BOT.msgs.pop();BOT.msgs.pop();botPaint();var c=e&&e.code;botErr(c==='not_granted'?'Asistan için izin verilmedi.':c==='rate_limited'?'Çok sık yazdın, biraz bekle.':'Asistan şu an yanıt veremedi, tekrar dene.');}
  BOT.busy=false;
}

  }
});

  h+='<div class="vs-g"><section><h3>Satışa giden yol</h3><p class="note" style="margin:0 0 8px">Seçili dönemde</p>'+

    '<section><h3>Cihaz</h3>'+top('d:',{mobil:'Telefon / tablet',masaustu:'Bilgisayar'})+'</section></div>';
  try{h+='<p class="note">Bu cihaz '+(localStorage.getItem('wf_nostat')?'sayılmıyor (yönetici cihazı).':'sayılıyor.')+'</p>';}catch(_){}

document.addEventListener('click',async function(e){
  var b=e.target.closest&&e.target.closest('[data-qp]');
  var ap=e.target.closest&&e.target.closest('[data-ad="addp"]');
  if(ap&&A){e.preventDefault();e.stopImmediatePropagation();qpOpen(null);return;}
  if(!b||!A)return;var inAd=e.target.closest('[data-ad]');if(inAd&&b.contains(inAd)&&inAd!==b)return;e.preventDefault();var a=b.dataset.qp,v=b.dataset.v;
  if(a==='new'){qpOpen(null);return;}
  if(a==='edit'){qpOpen(b.dataset.id);return;}
  if(!QP)return;
  if(a==='close'){QP=null;A.tab='urun';adRender();window.scrollTo(0,0);return;}
  if(a==='first'){var i=+b.dataset.i,t=QP.imgs.splice(i,1)[0];QP.imgs.unshift(t);qpRe();return;}
  if(a==='rmimg'){QP.imgs.splice(+b.dataset.i,1);qpRe();return;}
  if(a==='cat'){var ix=QP.cat.indexOf(v);if(ix>=0){QP.cat.splice(ix,1);var c=(A.draft.cats||[]).filter(function(x){return x.id===v;})[0];if(c){var ids=qpSubsOf(c).map(function(s){return s.id;});QP.sub=QP.sub.filter(function(s){return ids.indexOf(s)<0;});}}else QP.cat.push(v);qpRe();return;}
  if(a==='sub'){var j=QP.sub.indexOf(v);if(j>=0)QP.sub.splice(j,1);else{QP.sub.push(v);var ty=qpTypeOfSub(b.dataset.n);if(ty)QP.type=ty;}qpRe();return;}
  if(a==='type'){QP.type=QP.type===v?'':v;qpRe();return;}
  if(a==='color'){QP.color=QP.color===v?'':v;qpRe();return;}
  if(a==='color2'){var cn=prompt('Renk adı (örn. Taş, Hardal)');if(cn&&cn.trim()){QP.color=cn.trim().charAt(0).toLocaleUpperCase('tr')+cn.trim().slice(1);qpRe();}return;}
  if(a==='size'){var cur=qpSizes(),k=cur.indexOf(v);if(k>=0)cur.splice(k,1);else{var ord=qpAuto();cur.push(v);cur.sort(function(x,y){var a1=ord.indexOf(x),b1=ord.indexOf(y);return (a1<0?99:a1)-(b1<0?99:b1);});}
    var au=qpAuto();QP.sizes=cur.join(', ')===au.join(', ')?'':(cur.length?cur.join(', '):'-');qpRe();return;}
  if(a==='size2'){var z=prompt('Eklenecek beden (örn. 3XL, 42)');if(z&&z.trim()){var cs=qpSizes();if(cs.indexOf(z.trim())<0)cs.push(z.trim());QP.sizes=cs.join(', ');qpRe();}return;}
  if(a==='nosize'){QP.sizes=String(QP.sizes).trim()==='-'?'':'-';qpRe();return;}
  if(a==='more'){QP.more=true;qpRe();return;}
  if(a==='full'){var fid=QP.edit;QP=null;A.tab='urun';A.open=fid;adRender();setTimeout(function(){var r=document.querySelector('.aed');if(r)r.scrollIntoView({block:'start'});},60);return;}
  if(a==='del'){if(!QP.del){QP.del=true;qpRe();return;}var did=QP.edit;A.draft.products=A.draft.products.filter(function(x){return x.id!==did;});QP=null;A.tab='urun';A.dirty=true;await adSave();window.scrollTo(0,0);return;}
  if(a==='save'){
    var q=QP,pr=parseFloat(String(q.price).replace(',','.')),od=parseFloat(String(q.old).replace(',','.'));
    if(!q.name.trim()){toast('Ürün adını yaz');var n1=document.querySelector('[data-qpf="name"]');if(n1)n1.focus();return;}
    if(!(pr>0)){toast('Satış fiyatını yaz');var n2=document.querySelector('[data-qpf="price"]');if(n2)n2.focus();return;}
    if(!q.cat.length){toast('En az bir kategori seç');return;}
    if(!q.imgs.length&&!confirm('Fotoğraf eklemedin. Yine de kaydedilsin mi?'))return;
    var st=String(q.stock).trim()===''?null:Math.max(0,parseInt(q.stock,10)||0);
    var fields={name:q.name.trim(),price:pr,old:od>pr?od:null,cat:q.cat.slice(),sub:q.sub.slice(),type:q.type||'TİŞÖRT',color:q.color,sizes:q.sizes,stock:st,desc:q.desc||'',show:!!q.show,imgs:q.imgs.slice()};
    var list=A.draft.products=A.draft.products||[];
    if(q.edit){var p=list.filter(function(x){return x.id===q.edit;})[0];if(p)Object.assign(p,fields);}
    else{var np=Object.assign({id:'n'+Date.now().toString(36),no:pNums(list)+1,tag:''},fields);list.push(np);}
    A.dirty=true;var sv=document.getElementById('qpSave');if(sv){sv.disabled=true;sv.textContent='Kaydediliyor…';}
    var keep=QP;await adSave();
    if(!A.dirty){QP=null;A.tab='urun';adRender();window.scrollTo(0,0);toast(keep.edit?'Ürün güncellendi':'Ürün yayında');}
    else{QP=keep;A.tab='qp';adRender();}
  }
},true);

async function admHash(pw,salt){
  var enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  var b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
}

/* ===== MUHASEBE (gelir - gider) =====
   Veriler herkese açık data.json'a değil, yalnızca düzenleme yetkisi olanların okuyabildiği özel veritabanına (muhasebe koleksiyonu) yazılır. */
var DBX=null,ACC={rows:[],ok:false,err:'',month:'all',unsub:null,inv:null};
/* Canlı sitede muhasebe kayıtları Supabase'deki "muhasebe" tablosunda durur (yalnız yönetici okur/yazar).
   Aşağıdaki küçük katman, muhasebe kodunun kullandığı collection/add/doc/update/delete/onSnapshot arayüzünü Supabase ile sağlar. */
var SBDB={collection:function(name){
  var subs=[];
  async function fetchAll(){var tk=await sbToken();if(!tk)throw {code:'giriş gerekli'};
    var r=await sbReq('/rest/v1/'+name+'?select=*&order=created_at.desc&limit=5000',{token:tk});
    if(!r.ok)throw {code:r.status===404?'tablo yok':'okunamadı'};
    return (Array.isArray(r.j)?r.j:[]).map(function(x){return {id:x.id,data:function(){return x.doc||{};}};});}
  async function notify(){try{var docs=await fetchAll();subs.forEach(function(s){s[0]({docs:docs});});}catch(e){subs.forEach(function(s){if(s[1])s[1](e);});}}
  async function call(path,method,body){var tk=await sbToken();if(!tk)throw {code:'giriş gerekli'};var r=await sbReq(path,{method:method,token:tk,prefer:'return=minimal',body:body});if(!r.ok)throw {code:'kaydedilemedi'};await notify();}
  return {
    onSnapshot:function(cb,err){var s=[cb,err];subs.push(s);notify();return function(){subs=subs.filter(function(x){return x!==s;});};},
    add:function(doc){return call('/rest/v1/'+name,'POST',{doc:doc});},
    doc:function(id){var q='/rest/v1/'+name+'?id=eq.'+encodeURIComponent(id);return {
      delete:function(){return call(q,'DELETE');},
      update:function(upd){var cur0=(ACC.rows.filter(function(x){return x.id===id;})[0])||{},nd=Object.assign({},cur0,upd);delete nd.id;return call(q,'PATCH',{doc:nd});}};}
  };}};
SBDB.collection=(function(f){var cache={};return function(n){return cache[n]||(cache[n]=f(n));};})(SBDB.collection);
var ACC_G=['Site satışı','Baskı siparişi','Pazaryeri (Trendyol, n11...)','Toptan satış','Diğer gelir'],ACC_X=['Ürün / hammadde alımı','Baskı malzemesi (mürekkep, film)','Kargo','Reklam','Kira','Maaş ve SGK','Vergi','Komisyon (pazaryeri)','Ambalaj','Diğer gider'];

function n2(x){return (Math.round(x*100)/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function tl2(x){return '₺'+n2(x);}
function accTodayStr(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function accNet(r){var a=+r.amount||0,v=+r.vat||0;var net=a/(1+v/100);return {net:net,kdv:a-net};}
function accSum(rows){
  var o={g:0,x:0,gn:0,xn:0,gk:0,xk:0};
  rows.forEach(function(r){var k=accNet(r);if(r.type==='gelir'){o.g+=+r.amount||0;o.gn+=k.net;o.gk+=k.kdv;}else{o.x+=+r.amount||0;o.xn+=k.net;o.xk+=k.kdv;}});

}

   push({period, journal, entries}) -> Promise<{ok:true, ref}>. Anahtarlar sayfaya yazılmaz, sunucudaki küçük bir servis üzerinden gider.
   Bağlantı gelene kadar hesap kodlu yevmiye dosyası (CSV) mali müşavire e-posta ile gönderilir veya elle yüklenir.

var ACCOUNTANT={provider:null,push:function(batch){return Promise.reject({code:'not_connected'});}};
function accCodes(r){
  var m=r.method||'',cat=r.cat||'';
  var kars=(m==='Nakit')?['100','Kasa']:(m==='Pazaryeri'?['120','Alıcılar']:['102','Bankalar']);
  if(r.type==='gelir')return {kars:kars,main:['600','Yurtiçi satışlar'],kdv:['391','Hesaplanan KDV']};
  var g=/hammadde|Ürün/i.test(cat)?['153','Ticari mallar']:(/mürekkep|malzeme/i.test(cat)?['150','İlk madde ve malzeme']:['770','Genel yönetim giderleri']);
  return {kars:(m==='Nakit'||m==='Kart'||m==='Havale / EFT')?kars:['320','Satıcılar'],main:g,kdv:['191','İndirilecek KDV']};
}
function accJournal(rows){
  var L=['Tarih;Fiş no;Hesap kodu;Hesap adı;Açıklama;Borç;Alacak'],no=0,f=function(x){return String(Math.round(x*100)/100).replace('.',',');};
  rows.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).forEach(function(r){
    no++;var k=accNet(r),c=accCodes(r),fs='M'+('000'+no).slice(-4),ds=String(r.cat||'')+(r.desc?' - '+String(r.desc).replace(/;/g,','):''),g=+r.amount||0;
    var ln=function(h,b,a){L.push([r.date,fs,h[0],h[1],ds,b?f(b):'',a?f(a):''].join(';'));};
    if(r.type==='gelir'){ln(c.kars,g,0);ln(c.main,0,k.net);if(k.kdv)ln(c.kdv,0,k.kdv);}
    else{ln(c.main,k.net,0);if(k.kdv)ln(c.kdv,k.kdv,0);ln(c.kars,0,g);}
  });
  return L.join('\n');
}

/* Tek kelime alt satıra düşmesin: son iki kelimeyi birbirine bağla */
(function(){var SEL='p,h1,h2,h3,h4,li,.sig,.w,.kr-t,.lead,.eyebrow,figcaption,blockquote';
  function fix(el){if(el.closest('textarea,input,[contenteditable],.ad,#adm,script,style'))return;
    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),t,last=null;while((t=w.nextNode()))if(/\S/.test(t.nodeValue))last=t;
    if(!last)return;var v=last.nodeValue,m=v.match(/^([\s\S]*\S)( +)(\S+\s*)$/);if(!m)return;
    var lw=m[3].trim();if(lw.length>18)return;
    if((el.textContent||'').trim().split(/\s+/).length<4)return;
    last.nodeValue=m[1]+' '+m[3];}
  function run(root){try{(root.matches&&root.matches(SEL)?[root]:[]).concat([].slice.call((root.querySelectorAll?root:document).querySelectorAll(SEL))).forEach(fix);}catch(e){}}
  var q=[],tm=null;function flush(){var l=q;q=[];tm=null;l.forEach(run);}
  function start(){run(document.body);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1)q.push(n);else if(n.nodeType===3&&n.parentElement)q.push(n.parentElement);});});if(!tm)tm=setTimeout(flush,30);}).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();})();
</script>
