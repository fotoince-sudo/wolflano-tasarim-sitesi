"Koleksiyonu Keşfet",heroTitle:"Gücünü Sessizliğinden Alanlar İçin.",heroSub:"İtalyan estetiği, minimalist çizgiler ve kırılmaz bir irade. Wolflano yeni koleksiyonuyla zırhını keşfet.",heroTag:"MARKA OLMAK PAHALI OLMAK DEĞİL.",txtAlign:"İki yana yaslı",showCats:!0,featN:4,showWhy:!0,showAtolye:!0,whyTitle:"Neden Wolflano?",whyQuote:"Wolflano, gürültüyle değil, duruşuyla konuşanlar için doğdu.",whyText:"Bir kurt gibi yalnız ama korkusuz. İtalyan estetiği kadar zarif, bir zırh kadar kararlı.",whyLink:"Hikayemiz",atolyeTitle:"Wolflano Baskı Atölyesi",atolyeLead:"Kendi tasarımın, bizim tasarımımız ya da kurumuna özel toplu baskı.",atolyePageLead:"Kendi tasarımın, bizim tasarımımız ya da kurumuna özel toplu baskı. Önizlemede gördüğün gibi basıp kapına gönderiyoruz.",kolTitle:"Wolflano Koleksiyonu",aboutTitle:"Zafere Giden Yolda Bir Zırh",aboutLead:"Wolflano, sadece kumaşı ve dikişi mükemmelleştirilmiş giysiler sunmaz; her parçasında bir duruş, bir karakter ve bir hikaye taşır. Adını ve ilhamını, doğanın en bağımsız, en sabırlı ve pes etmeyen liderinden—kurt ruhundan—alır.",aboutPhilTitle:"Felsefemiz: Sabır ve Mükemmellik",aboutPhil:"Gerçek güç, zorluklar karşısında sesini yükseltmek değil; kaliteni, duruşunu ve adalete olan inancını en üst seviyeye çıkarmaktır. Hayatın acı tecrübelerinden süzülüp gelen bu vizyon, her detayında İtalyan tasarım anlayışının inceliğini ve zamansız stilini barındırır.",aboutPromTitle:"Sözümüz",aboutProm:"Sözü uzatmayız. Şov yapmayız. Ürettiğimiz her parçada en üst segment kumaşları, kusursuz kesimleri ve rafine detayları bir araya getirerek; kendi hayatının kahramanı olan insanlara hak ettikleri asaleti sunarız.",mfTitle:"Sessizliğin Gücü. Asil Bir Zafer.",mfText:["Hayat, herkesi aynı fırtınayla sınamaz. Bazıları için yol; engellerle, hak edilenin geç teslim edilişiyle ve sessizce verilen mücadelelerle doludur.","Wolflano, gürültüyle değil, duruşuyla konuşanlar için doğdu.","Biz; intikamın ve hak arayışının öfkeyle değil; sabır, strateji, sarsılmaz bir kalite ve şaşmaz bir adaletle kazanılacağına inanıyoruz. Yaşadığı her darbeden daha güçlü kalkan, kendi yolunu kendi çizen ve duruşundan asla taviz vermeyen modern kahramanların zırhıyız.","Bir kurt gibi yalnız ama korkusuz. İtalyan estetiği kadar zarif, bir zırh kadar kararlı."],mfSign:"Wolflano. Karakterini Üzerinde Taşı.",mfWords:"LİDER • BAĞIMSIZ • KORKUSUZ",lgTitle:"Logoya değil, kumaşa para öde",lgLead:"Bir tişörte ödediğin paranın ne kadarı gerçekten tişörte gidiyor? Biz hesabı açık yapıyoruz.",lgLh:"Lüks etikette ödediğin",lgRh:"Wolflano’da ödediğin",lgLeft:["Dev reklam kampanyaları ve ünlü yüzler","Logonun şişirilmiş adı","Vitrinler, gösterişli mağaza kiraları","Birkaç yıkamada yıpranınca duyduğun “kullanım hatası” cevabı"],lgRight:["Yoğun gramajlı, üst kalite kumaş","Güçlendirilmiş dikiş ve rafine detay","Zamansız, sade kesim","Sorun olursa bahane değil, muhatap"],krEyebrow:"Kökler & Ruh",krTitle:"Gücünü Sessizliğinden Alanlar İçin",krText:["Bozkırda rüzgâr hiç susmaz.","Ama kurt acele etmez.","Bekler. Dinler. Doğru anı bilir.","Köklerimiz binlerce yıl öncesine uzanır; sabırdan, adaletten ve sadakatten beslenir.","Biz bağırmayız. Duruşumuz konuşur.","Eğilmeyiz. Çünkü güç gürültüde değil, sessizliktedir.","Her dikiş bir söz. Her kumaş bir duruş."],krCards:["Sabır | Doğru an, bekleyenindir. Acele etmeden, emin adımlarla.","Adalet | Güç, hakkı koruyanındır. Her müşteriye aynı özen, aynı kalite.","Sadakat | Söz verilir, tutulur. Kumaşımıza, dikişimize ve sana."],showShip:!0,shipScroll:!1,shipMsgs:["{ucretsiz} ve üzeri siparişlerde kargo ücretsiz","Siparişler 2-4 iş gününde kargoya verilir","Hediye paketi her siparişte ücretsiz"],pnoteTitle:"Kumaş & Duruş Notu",pnote:"Bu parça, yoğun gramajlı üst kalite kumaşı ve zamansız kesimiyle sadece günlük şıklığınızı değil, dış dünyaya karşı sarsılmaz duruşunuzu temsil etmek üzere tasarlandı.",atolyeBtn:"Tasarlamaya başla",wolfTitle:"Wolf tasarlasın",wolfText:"Fikrini stüdyoda bir cümleyle yaz, tasarımını Wolf
